<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DONGU MES - 프레스 생산관리 통합포털</title>
<style>
:root{
  --top1-h:36px;--top2-h:72px;--left-w:210px;--tab-h:32px;
  --blue:#2d66ad;--blue-dark:#1f4f8c;--blue-soft:#dce8f6;
  --line:#a9b6c4;--line2:#c8d1da;--panel:#eef2f5;--header:#e7edf3;
  --text:#25313d;--muted:#667483;--shadow:rgba(24,45,67,.15);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--text);background:#dfe5ea;overflow:hidden}
button,input,select{font:inherit}button{cursor:pointer}
/* 1차 메뉴 */
.top-level-1{position:fixed;left:0;right:0;top:0;height:var(--top1-h);z-index:100;display:flex;align-items:stretch;background:linear-gradient(#f9fbfc,#e4eaf0);border-bottom:1px solid #8d9aaa;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.app-mark{width:92px;display:flex;align-items:center;justify-content:center;border-right:1px solid #b7c1cb;background:#f1f4f7;font-weight:900;color:#b63b30;letter-spacing:.5px}
.l1-menu{display:flex;align-items:stretch;overflow:auto;white-space:nowrap}
.l1-btn{min-width:96px;padding:0 14px;border:0;border-right:1px solid #c6ced6;background:transparent;color:#3d4a58;font-weight:700}
.l1-btn:hover{background:#edf3f9;color:var(--blue-dark)}
.l1-btn.active{background:#dce8f5;color:var(--blue-dark);box-shadow:inset 0 -3px 0 var(--blue)}
.top-status{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 12px;color:#6f7c89;font-size:11px;background:#f8fafc;border-left:1px solid #c6ced6;white-space:nowrap}
.status-dot{width:7px;height:7px;background:#2f9d63;border-radius:50%}
/* 2차 메뉴 */
.top-level-2{position:fixed;top:var(--top1-h);left:0;right:0;height:var(--top2-h);z-index:90;display:flex;align-items:stretch;background:linear-gradient(#f7f9fb,#e8edf2);border-bottom:1px solid #929fad}
.l2-title{width:92px;display:flex;align-items:center;justify-content:center;background:#eef2f6;border-right:1px solid #bdc7d0;color:#677482;font-weight:700}
.l2-menu{display:flex;align-items:stretch;overflow:auto;min-width:0}
.l2-btn{position:relative;min-width:88px;padding:8px 10px 6px;border:0;border-right:1px solid #ccd3da;background:transparent;color:#4b5967;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.l2-btn:hover{background:#fdfefe}.l2-btn.active{background:#fff;color:var(--blue-dark);box-shadow:inset 0 -3px 0 var(--blue)}
.l2-icon{width:28px;height:28px;display:grid;place-items:center;font-size:18px;border:1px solid #bcc7d2;background:linear-gradient(#fff,#e9eef3);box-shadow:inset 0 0 0 1px #fff}.l2-label{font-weight:700;font-size:11px}
/* 좌측 */
.left-panel{position:fixed;top:calc(var(--top1-h) + var(--top2-h));left:0;bottom:0;width:var(--left-w);z-index:80;background:#f4f6f8;border-right:1px solid #8f9dab;box-shadow:2px 0 4px rgba(0,0,0,.04);display:flex;flex-direction:column}
.left-head{height:34px;padding:0 10px;display:flex;align-items:center;gap:7px;background:linear-gradient(#edf2f6,#dbe3ea);border-bottom:1px solid #9eabb8;color:#314355;font-weight:800}.left-head .tiny{font-size:10px;color:#7a8793;margin-left:auto}
.tree{padding:4px 0;overflow:auto;flex:1;background:#f8fafb}.tree-group{border-bottom:1px solid #d5dce3}.tree-caption{padding:7px 10px;background:#edf2f6;color:#546271;font-weight:800;display:flex;align-items:center;gap:6px}.tree-caption::before{content:"▾";font-size:10px;color:#738394}
.tree-item{width:100%;border:0;background:transparent;text-align:left;padding:8px 8px 8px 26px;color:#475563;border-top:1px solid #f1f3f5;position:relative}.tree-item::before{content:"•";position:absolute;left:15px;color:#7d8b99}.tree-item:hover{background:#e8f0f8;color:#1f4f8c}.tree-item.active{background:#d6e5f6;color:#153f74;font-weight:800;box-shadow:inset 3px 0 0 var(--blue)}
/* 본문 + 누적 탭 */
.workspace{position:fixed;top:calc(var(--top1-h) + var(--top2-h));left:var(--left-w);right:0;bottom:0;background:#cdd5dc;display:flex;flex-direction:column;min-width:0}
.tabbar{height:var(--tab-h);display:flex;align-items:flex-end;gap:2px;padding:4px 5px 0;background:linear-gradient(#e7ecf1,#cfd7df);border-bottom:1px solid #8493a2;overflow-x:auto;overflow-y:hidden;white-space:nowrap}
.tab{height:28px;min-width:115px;max-width:210px;display:flex;align-items:center;border:1px solid #97a6b5;border-bottom:0;background:linear-gradient(#f5f7f9,#d9e0e7);color:#566371;padding:0 5px 0 9px;box-shadow:0 -1px 0 rgba(255,255,255,.7) inset}.tab.active{background:#fff;color:#234d7f;font-weight:800;border-color:#7990a8;position:relative;z-index:2}.tab .tab-title{overflow:hidden;text-overflow:ellipsis}.tab .close{margin-left:auto;width:20px;height:20px;border:0;background:transparent;color:#7e8994;font-size:14px;line-height:18px;padding:0}.tab .close:hover{background:#e1e7ed;color:#b23030}.tab-home .close{display:none}
.content-shell{flex:1;min-height:0;padding:7px 7px 29px;background:#dfe4e9}.page-frame{width:100%;height:100%;border:1px solid #8f9cab;background:#fff;box-shadow:0 1px 3px var(--shadow);display:block}
.bottom-status{position:fixed;left:var(--left-w);right:0;bottom:0;height:22px;display:flex;align-items:center;padding:0 8px;background:#e7ecf0;border-top:1px solid #9aa8b5;color:#6f7b87;font-size:10px;z-index:85;pointer-events:none}.bottom-status .right{margin-left:auto}
@media(max-width:900px){:root{--left-w:175px}.app-mark,.l2-title{width:78px}.l1-btn{min-width:78px;padding:0 10px}.l2-btn{min-width:74px}}
@media(max-width:680px){:root{--left-w:145px;--top2-h:64px}.top-status span:not(.status-dot){display:none}.app-mark{width:66px}.l2-title{width:66px}.l1-btn{min-width:72px}.l2-btn{min-width:68px;padding-left:6px;padding-right:6px}.tree-item{padding-left:21px}.tree-item::before{left:11px}.tab{min-width:100px}.left-head{padding:0 7px}}
</style>
</head>
<body>
<header class="top-level-1">
  <div class="app-mark">DONGU MES</div>
  <nav class="l1-menu" id="l1Menu"></nav>
  <div class="top-status"><span class="status-dot"></span><span>MES Connected</span><span id="clock"></span></div>
</header>
<section class="top-level-2">
  <div class="l2-title">업무메뉴</div><nav class="l2-menu" id="l2Menu"></nav>
</section>
<aside class="left-panel">
  <div class="left-head"><span id="leftTitle">생산실행</span><span class="tiny">MENU</span></div>
  <div class="tree" id="treeMenu"></div>
</aside>
<main class="workspace">
  <div class="tabbar" id="tabbar"></div>
  <div class="content-shell"><iframe id="mesFrame" name="donguMesContent" class="page-frame" src="index1_2.html?dongu_embed=1&view=prod" title="프레스 생산관리"></iframe></div>
</main>
<div class="bottom-status"><span>시스템: 프레스 생산관리 Rev.7.84</span><span style="margin-left:18px" id="activeStatus">화면: 생산작업</span><span class="right">Ready</span></div>
<script>
const MENU=[
 {key:'production',name:'생산관리',second:[
   {key:'material',name:'소재관리',icon:'▨',groups:[{name:'소재 업무',items:[['mat-order','소재발주'],['mat-dispatch','소재발송']]}]},
   {key:'execution',name:'생산실행',icon:'⚙',groups:[{name:'작업 실행',items:[['work-order','작업지시'],['prod','생산작업'],['report','생산일보']]}]}
 ]},
 {key:'quality',name:'품질관리',second:[
   {key:'inspection',name:'검사관리',icon:'✓',groups:[{name:'품질 검사',items:[['iqc','수입검사'],['measure','측정검사'],['visual','외관검사']]}]}
 ]},
 {key:'master',name:'기준정보',second:[
   {key:'prod-master',name:'생산기준',icon:'▦',groups:[{name:'설비 / 금형',items:[['master','호기설정'],['mold','금형설정']]}]}
 ]},
 {key:'system',name:'시스템',second:[
   {key:'sys-config',name:'시스템설정',icon:'▣',groups:[{name:'운영 설정',items:[['pin','PIN설정'],['config','DB설정'],['help','사용안내']]}]}
 ]}
];
const PAGE_META={
 'mat-order':['소재발주','소재 발주 등록 및 현황'], 'mat-dispatch':['소재발송','소재업체 발송 등록'],
 'work-order':['작업지시','프레스 작업지시'], 'prod':['생산작업','프레스 설비 생산 실행'], 'report':['생산일보','생산 실적 및 일보'],
 'iqc':['수입검사','소재 수입검사'], 'measure':['측정검사','검사성적서 · 치수측정'], 'visual':['외관검사','LOT 외관검사'],
 'master':['호기설정','프레스 호기 기준정보'], 'mold':['금형설정','금형 기준정보'],
 'pin':['PIN설정','사용자 PIN 관리'], 'config':['DB설정','연결 및 시스템 설정'], 'help':['사용안내','프레스 생산관리 사용안내']
};
let currentL1='production',currentL2='execution',activeTab='prod';
const openTabs=new Map([['prod',{id:'prod',title:'생산작업'}]]);
function byId(id){return document.getElementById(id)}
function getL1(){return MENU.find(x=>x.key===currentL1)||MENU[0]}
function getL2(){return getL1().second.find(x=>x.key===currentL2)||getL1().second[0]}
function findNav(view){
 for(const l1 of MENU)for(const l2 of l1.second)for(const g of l2.groups)for(const it of g.items)if(it[0]===view)return {l1:l1.key,l2:l2.key};
 return null;
}
function buildL1(){byId('l1Menu').innerHTML=MENU.map(m=>`<button class="l1-btn ${m.key===currentL1?'active':''}" onclick="selectL1('${m.key}')">${m.name}</button>`).join('')}
function buildL2(){const l1=getL1();byId('l2Menu').innerHTML=l1.second.map(m=>`<button class="l2-btn ${m.key===currentL2?'active':''}" onclick="selectL2('${m.key}')"><span class="l2-icon">${m.icon}</span><span class="l2-label">${m.name}</span></button>`).join('')}
function buildTree(){const l2=getL2();byId('leftTitle').textContent=l2.name;byId('treeMenu').innerHTML=l2.groups.map(g=>`<div class="tree-group"><div class="tree-caption">${g.name}</div>${g.items.map(([id,label])=>`<button class="tree-item ${id===activeTab?'active':''}" onclick="openPage('${id}')">${label}</button>`).join('')}</div>`).join('')}
function selectL1(key){currentL1=key;currentL2=getL1().second[0].key;buildL1();buildL2();buildTree()}
function selectL2(key){currentL2=key;buildL2();buildTree()}
function syncNavToView(id){const n=findNav(id);if(!n)return;currentL1=n.l1;currentL2=n.l2;buildL1();buildL2();buildTree()}
function openPage(id,send=true){const meta=PAGE_META[id]||[id,''];if(!openTabs.has(id))openTabs.set(id,{id,title:meta[0]});activeTab=id;syncNavToView(id);renderTabs();setStatus(id);if(send)sendView(id)}
function activateTab(id){openPage(id,true)}
function closePage(id,ev){if(ev)ev.stopPropagation();if(id==='prod')return;const ids=[...openTabs.keys()],idx=ids.indexOf(id);openTabs.delete(id);if(activeTab===id){const next=ids[idx-1]||ids[idx+1]||'prod';activeTab=openTabs.has(next)?next:'prod';openPage(activeTab,true)}else renderTabs()}
function renderTabs(){byId('tabbar').innerHTML=[...openTabs.values()].map(t=>`<div class="tab ${t.id===activeTab?'active':''} ${t.id==='prod'?'tab-home':''}" onclick="activateTab('${t.id}')"><span class="tab-title">${t.title}</span><button class="close" title="닫기" onclick="closePage('${t.id}',event)">×</button></div>`).join('');requestAnimationFrame(()=>byId('tabbar').querySelector('.tab.active')?.scrollIntoView({block:'nearest',inline:'nearest'}))}
function sendView(id){const f=byId('mesFrame');try{f.contentWindow.postMessage({type:'dongu-open-view',view:id},'*')}catch(e){}}
function setStatus(id){byId('activeStatus').textContent='화면: '+((PAGE_META[id]||[id])[0])}
window.addEventListener('message',ev=>{const d=ev.data||{};if(d.type!=='dongu-child-view'||!PAGE_META[d.view])return;if(!openTabs.has(d.view))openTabs.set(d.view,{id:d.view,title:PAGE_META[d.view][0]});activeTab=d.view;syncNavToView(d.view);renderTabs();setStatus(d.view)});
byId('mesFrame').addEventListener('load',()=>setTimeout(()=>sendView(activeTab),180));
function tick(){const d=new Date();byId('clock').textContent=d.toLocaleString('ko-KR',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
buildL1();buildL2();buildTree();renderTabs();setStatus(activeTab);tick();setInterval(tick,30000);
</script>
</body>
</html>
